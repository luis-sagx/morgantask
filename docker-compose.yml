# =============================================================
# docker-compose.yml — Base configuration (shared services)
# Usage:
#   Dev:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   Prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================

services:
  mongo:
    image: mongo:7
    container_name: morgantask_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-morgantask}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-morgantask}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-morgantask_mern}
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo_data: