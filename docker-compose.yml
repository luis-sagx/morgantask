version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: morgantask_mongo
    restart: unless-stopped
    ports:
      - "27019:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: morgantask
      MONGO_INITDB_ROOT_PASSWORD: morgantask
      MONGO_INITDB_DATABASE: morgantask_mern
    volumes:
      - mongo_data:/data/db

  backend:
    image: node:20-alpine
    container_name: morgantask_backend
    working_dir: /app
    volumes:
      - ./morgantask_backend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    ports:
      - "4000:4000"
    env_file:
      - ./morgantask_backend/.env
    environment:
      DATABASE_URL: mongodb://morgantask:morgantask@mongo:27017/morgantask_mern?authSource=admin
      FRONTEND_URL: http://localhost:5173
      PORT: 4000
    depends_on:
      - mongo

  frontend:
    image: node:20-alpine
    container_name: morgantask_frontend
    working_dir: /app
    volumes:
      - ./morgantask_frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:4000/api
    depends_on:
      - backend

volumes:
  mongo_data:
