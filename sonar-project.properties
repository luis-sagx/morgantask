sonar.projectKey=morgantask
sonar.projectName=MorganTask
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

sonar.sources=morgantask_backend/src,morgantask_frontend/src
sonar.tests=morgantask_backend/src,morgantask_frontend/src

sonar.test.inclusions=\
  morgantask_backend/src/**/__tests__/**/*.test.ts,\
  morgantask_frontend/src/**/*.test.ts,\
  morgantask_frontend/src/**/*.test.tsx

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  morgantask_frontend/src/test/**

sonar.typescript.tsconfigPaths=tsconfig.json,morgantask_backend/tsconfig.json
sonar.javascript.lcov.reportPaths=morgantask_backend/coverage/lcov.info,morgantask_frontend/coverage/lcov.info

sonar.coverage.exclusions=\
  morgantask_backend/src/index.ts,\
  morgantask_backend/src/server.ts,\
  morgantask_backend/src/infrastructure/config/**,\
  morgantask_backend/src/infrastructure/models/**,\
  morgantask_backend/src/infrastructure/container.ts,\
  morgantask_backend/src/interfaces/routes/**,\
  morgantask_backend/src/domain/**,\
  morgantask_frontend/src/main.tsx,\
  morgantask_frontend/src/router.tsx,\
  morgantask_frontend/src/vite-env.d.ts
