name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_full_k6_suite:
        description: "Run stress and spike k6 tests too"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  BACKEND_DIR: morgantask_backend
  FRONTEND_DIR: morgantask_frontend

jobs:
  install:
    name: install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm install --frozen-lockfile

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: install

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm install --frozen-lockfile

      - name: Run backend lint
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm run lint

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile

      - name: Run frontend lint
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm run lint

  tests:
    name: tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm install --frozen-lockfile

      - name: Run backend tests
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          JWT_SECRET: test-secret-for-ci
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm exec jest --passWithNoTests --runInBand

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile

      - name: Run frontend tests
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm vitest run

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm install --frozen-lockfile

      - name: Generate backend coverage
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          JWT_SECRET: test-secret-for-ci
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm exec jest --coverage --runInBand

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile

      - name: Generate frontend coverage
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm vitest run --coverage

      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: morgantask_backend/coverage
          if-no-files-found: error

      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: morgantask_frontend/coverage
          if-no-files-found: error

  audit:
    name: audit
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm install --frozen-lockfile

      - name: Audit backend dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm audit --audit-level=high

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile

      - name: Audit frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm audit --audit-level=high

  sonar-scanner:
    name: sonar-scanner
    runs-on: ubuntu-latest
    needs: coverage
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}

    steps:
      - name: Skip SonarQube scan when secrets are missing
        if: ${{ env.SONAR_TOKEN == '' || env.SONAR_ORGANIZATION == '' || env.SONAR_PROJECT_KEY == '' }}
        run: echo "Skipping SonarCloud scan because SONAR_TOKEN, SONAR_ORGANIZATION, or SONAR_PROJECT_KEY is not configured."

      - name: Checkout repository
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != '' && env.SONAR_PROJECT_KEY != '' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend coverage
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != '' && env.SONAR_PROJECT_KEY != '' }}
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: morgantask_backend/coverage

      - name: Download frontend coverage
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != '' && env.SONAR_PROJECT_KEY != '' }}
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: morgantask_frontend/coverage

      - name: Run SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != '' && env.SONAR_PROJECT_KEY != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          args: >
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}

  k6-performance-tests:
    name: k6 performance tests
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Prepare production environment file
        run: |
          cp .env.production.example .env.production
          echo "FRONTEND_PORT=80" >> .env.production

      - name: Start application stack
        run: docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build

      - name: Wait for nginx and API
        run: |
          for attempt in $(seq 1 30); do
            nginx_status="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/health || true)"
            api_status="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/api/auth/user || true)"
            echo "Attempt $attempt: nginx=$nginx_status api=$api_status"
            if [ "$nginx_status" = "200" ] && { [ "$api_status" = "401" ] || [ "$api_status" = "200" ]; }; then
              exit 0
            fi
            sleep 5
          done
          echo "Application stack did not become ready in time."
          docker compose --env-file .env.production -f docker-compose.prod.yml logs
          exit 1

      - name: Run smoke performance test
        env:
          BASE_URL: http://127.0.0.1
          TEST_EMAIL: k6-${{ github.run_id }}-smoke@morgantask.com
          TEST_PASSWORD: testpassword123
        run: k6 run k6/smoke_test.js

      - name: Run load performance test
        if: ${{ github.event_name != 'pull_request' }}
        env:
          BASE_URL: http://127.0.0.1
          TEST_EMAIL: k6-${{ github.run_id }}-load@morgantask.com
          TEST_PASSWORD: testpassword123
        run: k6 run k6/load_test.js

      - name: Run stress performance test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full_k6_suite == 'true' }}
        env:
          BASE_URL: http://127.0.0.1
          TEST_EMAIL: k6-${{ github.run_id }}-stress@morgantask.com
          TEST_PASSWORD: testpassword123
        run: k6 run k6/stress_test.js

      - name: Run spike performance test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full_k6_suite == 'true' }}
        env:
          BASE_URL: http://127.0.0.1
          TEST_EMAIL: k6-${{ github.run_id }}-spike@morgantask.com
          TEST_PASSWORD: testpassword123
        run: k6 run k6/spike_test.js

      - name: Show compose logs on failure
        if: failure()
        run: docker compose --env-file .env.production -f docker-compose.prod.yml logs --no-color

      - name: Stop application stack
        if: always()
        run: docker compose --env-file .env.production -f docker-compose.prod.yml down -v
