name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  VPS_SSH_USER: ${{ secrets.VPS_USER != '' && secrets.VPS_USER || secrets.VPS_USERNAME }}
  VPS_SSH_PORT: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || '22' }}
  VPS_DEPLOY_PATH: ${{ secrets.VPS_APP_PATH != '' && secrets.VPS_APP_PATH || '/opt/morgantask' }}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: VPS deployment
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ env.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ env.VPS_SSH_PORT }}
          script: |
            set -eu
            APP_PATH="${{ env.VPS_DEPLOY_PATH }}"

            if [ ! -d "$APP_PATH/.git" ]; then
              echo "No git repository found at $APP_PATH"
              echo "Clone the repository on the VPS first and verify git access before running this workflow."
              exit 1
            fi

            cd "$APP_PATH"
            git fetch origin
            git checkout main
            git pull origin main

            cat > "$APP_PATH/.env.production" <<'EOF'
            ${{ secrets.VPS_ENV_PRODUCTION }}
            EOF

            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --remove-orphans
            docker image prune -f
