name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: VPS deployment
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy application files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "docker-compose.yml,docker-compose.prod.yml,docker,morgantask_backend,morgantask_frontend,README.md,.env.production.example"
          target: ${{ secrets.VPS_APP_PATH }}
          overwrite: true
          strip_components: 0

      - name: Build and restart containers on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -eu
            mkdir -p "${{ secrets.VPS_APP_PATH }}"
            cat > "${{ secrets.VPS_APP_PATH }}/.env.production" <<'EOF'
            ${{ secrets.VPS_ENV_PRODUCTION }}
            EOF
            cd "${{ secrets.VPS_APP_PATH }}"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
            docker image prune -f
