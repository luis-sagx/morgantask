# =============================================================
# docker-compose.prod.yml — Production
# Compiled frontend (nginx), optimized backend, restart policies
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
# =============================================================

services:
  mongo:
    image: mongo:7
    container_name: morgantask_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-morgantask}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-morgantask}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-morgantask_mern}
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  backend:
    build:
      context: ./morgantask_backend
      dockerfile: ../docker/backend/Dockerfile
      target: production
    container_name: morgantask_backend
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      - mongo
    networks:
      - app-network

  frontend:
    build:
      context: ./morgantask_frontend
      dockerfile: ../docker/frontend/Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: morgantask_frontend
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo_data:
